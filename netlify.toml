[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/upload-product-image"
  to = "/.netlify/functions/upload-product-image"
  status = 200

[[redirects]]
  from = "/razorpay/create-order"
  to = "/.netlify/functions/razorpay-create-order"
  status = 200

[[redirects]]
  from = "/razorpay/verify"
  to = "/.netlify/functions/razorpay-verify"
  status = 200

# SPA fallback — static files (sitemap.xml, robots.txt) in dist/ are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
